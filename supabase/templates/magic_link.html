<!--
  Magic Link テンプレート（実装仕様書 4章の画面表 / 5.1節）。

  > OAuth／Magic Link のコールバックは `/auth/callback` で処理する。

  `/auth/callback` は PKCE のコード交換（`exchangeCodeForSession`）を行うため、
  ここは **既定の `{{ .ConfirmationURL }}` のまま**にする。
  `{{ .ConfirmationURL }}` は Supabase の `/auth/v1/verify` を経由し、
  `emailRedirectTo`（= `/auth/callback?next=<検証済みパス>`）へ `?code=` を付けて戻す。

  ここを `{{ .TokenHash }}` 形式へ変えると `/auth/callback` の `code` が
  無くなり `missing_code` で失敗する。変更する場合は着地先も併せて見直すこと。
-->
<h2>ログイン用リンク</h2>

<p>以下のリンクを開くと、パスワードを入力せずにログインできます。</p>

<p>
  <a href="{{ .ConfirmationURL }}">ログインする</a>
</p>

<p>
  このリンクは一定時間で失効し、一度使うと再利用できません。失効した場合は、ログイン画面からもう一度リンクを送信してください。
</p>

<p>心当たりがない場合は、このメールを破棄してください。</p>
