# 実装仕様書 12章のCI。E2E の追加は後続フェーズで行う。
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.x
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - run: npm run build
      - run: npm run env:check
      # 本番依存に脆弱性が1件でもあれば非ゼロ終了し、CI を失敗させる。
      # dev 依存は docs/known-issues.md SEC-2 で別途管理する。
      - run: npm audit --omit=dev
